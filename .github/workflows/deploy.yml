name: Secure Deploy OmniSaaS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject GitHub Secrets into Production Build
        run: |
          if [ -n "${{ secrets.GOOGLE_SCRIPT_URL }}" ]; then
            sed -i "s|googleScriptUrl: .*|googleScriptUrl: \"${{ secrets.GOOGLE_SCRIPT_URL }}\",|g" config.js
          fi
          if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
            sed -i "s|googleClientId: .*|googleClientId: \"${{ secrets.GOOGLE_CLIENT_ID }}\",|g" config.js
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
